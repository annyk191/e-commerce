<mat-card class="produto-card">

<mat-card-header>
<mat-card-title>{{nome | uppercase}}</mat-card-title>
</mat-card-header>

<mat-card-content>
<P>{{preco | precoFormatado}}</P>
</mat-card-content>

<mat-card-actions>
    <button mat-raised-button="primary" (click) ="selecionarProduto()">
    selecionar {{nome}}
</button>

<button mat-stroked-button color="accent"   (click)="adicionarAoCarrinho()">
    Adicionar ao carrinho
</button>
</mat-card-actions>

</mat-card>
