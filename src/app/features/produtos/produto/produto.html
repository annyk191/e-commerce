<mat-card class="produto-card">

  <mat-card-header>
    <mat-card-title>
      {{ nome | uppercase }}
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p>{{ preco | precoFormatado }}</p>
  </mat-card-content>

  <mat-card-actions>

    <button mat-raised-button color="primary" type="button" (click)="selecionarProduto()"> Selecionar {{ nome }}</button>
    <button mat-stroked-button color="accent" type="button"  (click)="adicionarAoCarrinho()"> Adicionar ao carrinho</button>
    <button mat-stroked-button type="button" class="btn-favorito" (click)="adicionarFavorito()"> {{ estaFavorito() ? '❤️' : '♡' }}
      {{ estaFavorito() ? 'Favoritado' : 'Favoritar' }}</button>
  </mat-card-actions>
</mat-card>
